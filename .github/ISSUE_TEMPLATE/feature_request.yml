name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation first, then what you would like the tool to do. Remember it never merges, force-pushes or deletes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today?
